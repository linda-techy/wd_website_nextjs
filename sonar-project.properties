sonar.projectKey=wd_website_nextjs
sonar.projectName=WD Website (Next.js)

sonar.sources=src
sonar.tests=__tests__
sonar.test.inclusions=__tests__/**/*

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions: build output, deps, generated, static assets
sonar.exclusions=node_modules/**,.next/**,public/**,scripts/**,pacts/**,**/*.config.ts,**/*.config.mjs,next-env.d.ts,**/*.d.ts

# TypeScript config for type-aware analysis
sonar.typescript.tsconfigPath=tsconfig.json

# JS/TS coverage (lcov) - picked up if you run: npm test -- --coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
